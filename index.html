<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>OZON</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">OZON</div>
        <button class="cart-btn">корзина</button>
    </header>

    <section class="banner">
        <!-- Твоя реклама. Назови файл banner.jpg и положи рядом -->
        <img src="images/реклама.png" alt="Реклама">
    </section>

    <main class="grid">
        <div class="card">
            <img src="images/голова.webp" alt="Товар">
            <div class="info">
                <div class="price">376 р.</div>
                <div class="desc">Сушеная голова</div>
            </div>
        </div>
        <div class="card">
            <img src="images/мяухруст.webp" alt="Товар">
            <div class="info">
                <div class="price">623 р.</div>
                <div class="desc">Игрушка мяухруст</div>
            </div>
        </div>
        <div class="card">
            <img src="images/набор.webp" alt="Товар">
            <div class="info">
                <div class="price">1658 р.</div>
                <div class="desc">Карнавальный набор аниме кошки </div>
            </div>
        </div>
        <div class="card">
            <img src="images/ничего.webp" alt="Товар">
            <div class="info">
                <div class="price">294 р.</div>
                <div class="desc">Коробка подарочная складная "Ничего"</div>
            </div>
        </div>
        <div class="card">
            <img src="images/палка.webp" alt="Товар">
            <div class="info">
                <div class="price">359 р.</div>
                <div class="desc">палка для битья крапивы</div>
            </div>
        </div>
        <div class="card">
            <img src="images/сквиш.webp" alt="Товар">
            <div class="info">
                <div class="price">193 р.</div>
                <div class="desc">Сквиш пельмень антистресс  </div>
            </div>
        </div>
    </main>

</body>
</html>
